<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5d82b3">
<link rel="manifest" href="manifest.webmanifest">
<title>ほいサポ2</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:#f5f7fa;color:#222}
header{background:linear-gradient(#6f95c4,#5279aa);color:#fff;padding:16px;font-size:28px;font-weight:800}
main{max-width:760px;margin:auto;padding:14px}
.tabs,.row,.dangerRow,.actions{display:flex;gap:8px}
.tabs button,.row>*{flex:1}.dangerRow button{flex:1}
button{border:0;border-radius:14px;padding:13px 14px;background:#5d82b3;color:#fff;font-weight:800;font-size:16px}
button.secondary{background:#e7ecf3;color:#222}
button.delete{background:#fff;color:#c93030;border:2px solid #d33}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
label{display:block;font-weight:800;margin:12px 0 6px}
input,textarea,select{width:100%;padding:12px;border:2px solid #d3dbe5;border-radius:12px;background:#fff;font:inherit}
textarea{min-height:115px;resize:vertical}
.section{border-left:6px solid #5d82b3;padding-left:10px;margin-top:18px}
.section h2{font-size:20px;margin:5px 0 10px}
.hidden{display:none}.status{margin:10px 0;padding:12px;border-radius:12px;background:#edf4fb;white-space:pre-wrap}
.small{font-size:13px;color:#667}.record{border:1px solid #dbe2ea;border-radius:12px;padding:12px;margin-top:9px}
.actions{margin-top:8px}.actions button{flex:1}
.exportBox{margin-top:16px;padding:14px;border:2px solid #d8e2ef;border-radius:14px;background:#f8fbff}
.exportBox h3{margin:0 0 8px}
</style>
</head>
<body>
<header>ほいサポ2</header>
<main>

<div class="tabs">
<button id="recordTab">記録</button>
<button id="historyTab" class="secondary">履歴</button>
<button id="settingsTab" class="secondary">AI設定</button>
</div>

<section id="recordPage" class="card">
<h2>訪問記録</h2>

<div class="dangerRow">
<button id="deleteChild" class="delete">名前を消去</button>
<button id="deleteRecord" class="delete">記録を消去</button>
</div>

<label>対象児</label>
<div class="row">
<select id="child"></select>
<button id="addChild" class="secondary">児童追加</button>
</div>

<label>訪問日時</label>
<div class="row">
<input id="date" type="date">
<input id="startTime" type="time">
<input id="endTime" type="time">
</div>

<label>メモ</label>
<textarea id="memo" placeholder="観察したこと、本人への支援、担任とのやり取りなど"></textarea>

<div class="row">
<button id="voice">音声入力</button>
<button id="organize">整理する</button>
</div>

<div id="status" class="status hidden"></div>

<div class="section"><h2>① 学級・学校の様子</h2><textarea id="school"></textarea></div>
<div class="section"><h2>② 直接支援</h2><textarea id="direct"></textarea></div>
<div class="section"><h2>③ 間接支援</h2><textarea id="indirect"></textarea></div>

<div class="row">
<button id="save">記録を保存</button>
<button id="new" class="secondary">新しい記録</button>
</div>

<div class="exportBox">
<h3>Excel出力</h3>
<p class="small">ファイル名は「下の名前_YYMMDD.xlsx」で保存します。</p>
<button id="exportExcel">Excelを出力</button>
</div>
</section>

<section id="historyPage" class="card hidden">
<h2>訪問履歴</h2>
<div id="history"></div>
</section>

<section id="settingsPage" class="card hidden">
<h2>AI設定</h2>
<label>使用するAI</label>
<select><option>ChatGPT</option><option>Gemini</option><option>Claude</option><option>AIなし</option></select>
<label>AIに送る前に匿名化</label>
<select><option>ON</option><option>OFF</option></select>
<p class="small">メモを記録文に整えて①②③に整理します。現在は端末内で処理し、外部AIへの自動送信は行いません。</p>
</section>
</main>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
"use strict";
var CK="hoisapo2_children_v6",RK="hoisapo2_records_v6";
var children=JSON.parse(localStorage.getItem(CK)||'["桜田 淳子"]');
var records=JSON.parse(localStorage.getItem(RK)||"[]");
var editingId=null;

function $(id){return document.getElementById(id)}
function persist(){
 localStorage.setItem(CK,JSON.stringify(children));
 localStorage.setItem(RK,JSON.stringify(records));
}
function status(t){$("status").textContent=t;$("status").classList.remove("hidden")}
function renderChildren(){
 var s=$("child");s.innerHTML="";
 children.forEach(function(n){
  var o=document.createElement("option");o.value=n;o.textContent=n;s.appendChild(o)
 })
}
function show(id){
 ["recordPage","historyPage","settingsPage"].forEach(function(x){$(x).classList.add("hidden")});
 $(id).classList.remove("hidden")
}
function split(t){
 return t.replace(/\r/g,"").split(/(?<=[。！？\n])/).map(function(x){return x.trim()}).filter(Boolean)
}
function normalizeRecordSentence(s){
 var x=s.trim();

 // 会話調を記録調へ。意味や事実は追加しない。
 x=x.replace(/個別に声をかけると、/g,"個別に声をかけ、");
 x=x.replace(/声をかけると、/g,"声をかけ、");
 x=x.replace(/声を掛けると、/g,"声をかけ、");
 x=x.replace(/確認することができた。?$/g,"確認した。");
 x=x.replace(/確認することができた$/g,"確認した");
 x=x.replace(/できました。?$/g,"できた。");
 x=x.replace(/と聞いた。?$/g,"とのこと。");
 x=x.replace(/と聞いた$/g,"とのこと");
 return x;
}

function classifyRecordSentence(s){
 var t=s.trim();

 // まず「担任等との相談・情報共有」は③。
 var indirect=/(担任|教師|先生|保育士|学校側|園側|保護者).*(話し合|相談|情報共有|共有|助言|伝え|方針|対応方法|環境調整)|((話し合|相談|情報共有|共有|助言|対応方法|環境調整|今後の支援方針).*(担任|教師|先生|保育士|学校|園|保護者))/;
 if(indirect.test(t)) return "indirect";

 // 「本人への声かけ・説明・援助・確認」は②。
 var direct=/(本人|児童|子ども|本人に|本人と|個別に).*(声をかけ|声掛け|説明|促し|支援|援助|手伝|一緒に|確認|介入)|((個別に声|声をかけ|声掛け|説明|促し|援助|一緒に確認).*(予定|活動|課題|本人|児童|子ども))/;
 if(direct.test(t)) return "direct";

 // それ以外は観察・学校生活の様子として①。
 return "school";
}

function organize(){
 var t=$("memo").value.trim();
 if(!t){status("まずメモを入力してください。");return}

 var a=[],b=[],c=[];
 split(t).forEach(function(raw){
  var s=normalizeRecordSentence(raw);
  if(!s)return;

  // 1文の中に「本人への直接支援」→「担任との話し合い」が
  // 続けて書かれている場合は、接続部分で分ける。
  var parts=s.split(/(?=その後|そのうえで|続いて|また、)(?=その後|そのうえで|続いて|また、)/);
  if(parts.length===1){
   var m=s.match(/^(.*?)(?:。)(その後|そのうえで|続いて|また、)(.*)$/);
   if(m) parts=[m[1]+"。",m[2]+m[3]];
  }

  parts.forEach(function(p){
   p=p.trim();
   if(!p)return;
   var type=classifyRecordSentence(p);
   if(type==="indirect")c.push(p);
   else if(type==="direct")b.push(p);
   else a.push(p);
  });
 });

 $("school").value=[...new Set(a)].join("\n");
 $("direct").value=[...new Set(b)].join("\n");
 $("indirect").value=[...new Set(c)].join("\n");
 status("記録文として整理しました。内容を確認・修正してから保存してください。");
}
function saveRecord(){
 var r={id:editingId||Date.now(),child:$("child").value,date:$("date").value,memo:$("memo").value,school:$("school").value,direct:$("direct").value,indirect:$("indirect").value};
 var i=records.findIndex(function(x){return x.id===r.id});
 if(i>=0)records[i]=r;else records.unshift(r);
 persist();editingId=r.id;renderHistory();status("保存しました。")
}
function renderHistory(){
 var h=$("history"),name=$("child").value;h.innerHTML="";
 var list=records.filter(function(r){return r.child===name});
 if(!list.length){h.innerHTML='<p class="small">この児童の記録はまだありません。</p>';return}
 list.forEach(function(r){
  var d=document.createElement("div");d.className="record";
  d.innerHTML="<b>"+r.date+"</b><br><span class='small'>"+(r.school||"").slice(0,100)+"</span>";
  var a=document.createElement("div");a.className="actions";
  var o=document.createElement("button");o.textContent="開く";o.className="secondary";o.onclick=function(){load(r.id)};
  var x=document.createElement("button");x.textContent="この記録を消去";x.className="delete";x.onclick=function(){deleteRecordById(r.id)};
  a.appendChild(o);a.appendChild(x);d.appendChild(a);h.appendChild(d)
 })
}
function load(id){
 var r=records.find(function(x){return x.id===id});if(!r)return;
 editingId=r.id;$("child").value=r.child;$("date").value=r.date;$("memo").value=r.memo||"";
 $("school").value=r.school||"";$("direct").value=r.direct||"";$("indirect").value=r.indirect||"";
 show("recordPage");status("保存済み記録を開きました。")
}
function deleteRecordById(id){
 if(!confirm("この訪問記録を消去します。\nこの操作は元に戻せません。\n\n消去しますか？"))return;
 records=records.filter(function(r){return r.id!==id});persist();
 if(editingId===id)newRecord();renderHistory();status("記録を消去しました。")
}
function deleteCurrent(){
 if(editingId!==null){deleteRecordById(editingId);return}
 status("現在編集中の保存済み記録はありません。")
}
function deleteChild(){
 var name=$("child").value;if(!name)return;
 var count=records.filter(function(r){return r.child===name}).length;
 if(!confirm("「"+name+"」を消去します。\nこの児童に紐づく訪問記録 "+count+" 件もすべて消去されます。\n\nこの操作は元に戻せません。\n\n消去しますか？"))return;
 children=children.filter(function(n){return n!==name});
 records=records.filter(function(r){return r.child!==name});
 if(!children.length)children=["桜田 淳子"];
 persist();renderChildren();newRecord();status("児童名と、その児童の記録を消去しました。")
}
function newRecord(){
 editingId=null;$("memo").value="";$("school").value="";$("direct").value="";$("indirect").value="";
 $("date").value=new Date().toISOString().slice(0,10)
}
function voice(){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){status("音声認識が利用できません。iPhoneキーボードのマイクを使ってください。");return}
 var r=new SR();r.lang="ja-JP";r.interimResults=false;status("音声を聞いています。話してください。");
 r.onresult=function(e){$("memo").value+=($("memo").value?"\n":"")+e.results[0][0].transcript};
 r.onerror=function(e){status("音声入力エラー："+e.error)};
 r.onend=function(){status("音声入力を終了しました.")};r.start()
}

/* 下の名前＋YYMMDD */
/* Excel出力：個人情報を除いた原本テンプレートを読み込み、正規のXLSXとして保存します。 */
function fileName(){
 var full=$("child").value.trim();
 var parts=full.split(/[\s　]+/).filter(Boolean);
 var first=parts.length>=2?parts[parts.length-1]:full;
 var d=$("date").value.replace(/-/g,"").slice(2);
 return first+"_"+d+".xlsx";
}
function ymdJP(iso){
 var m=iso.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m)return null;
 var y=+m[1],mo=+m[2],da=+m[3];
 return {year:y,reiwa:y-2018,month:mo,day:da,weekday:["日","月","火","水","木","金","土"][new Date(y,mo-1,da).getDay()]};
}
function setCellKeepStyle(ws, addr, value, verticalTop, wrapText){
 var cell=ws[addr]||{t:'s',v:''};
 // 値は維持しつつ、本文欄は「上寄せ＋折り返し」を明示。
 cell.t='s';
 cell.v=value==null?'':String(value);
 if(verticalTop){
   cell.s = cell.s || {};
   cell.s.alignment = cell.s.alignment || {};
   cell.s.alignment.vertical='top';
   cell.s.alignment.wrapText = (wrapText !== false);
 }
 ws[addr]=cell;
}

async function exportExcel(){
 if(!$('child').value||!$('date').value){status('対象児と訪問日時を確認してください。');return}
 if(typeof XLSX==='undefined'){status('Excel出力機能の読み込みに失敗しました。通信状態を確認してください。');return}
 try{
  status('Excelを作成しています…');
  var res=await fetch('./hoisapo_template.xlsx',{cache:'no-store'});
  if(!res.ok)throw new Error('template '+res.status);
  var buf=await res.arrayBuffer();
  var wb=XLSX.read(buf,{type:'array',cellStyles:true,cellNF:true,cellDates:true});
  var ws=wb.Sheets['記録テンプレート']||wb.Sheets[wb.SheetNames[0]];
  var d=ymdJP($('date').value);
  if(!d)throw new Error('date');

  var child=$('child').value.trim();

  // シート名：YYMMDD＋下の名前
  var first=child.split(/[\s　]+/).filter(Boolean).slice(-1)[0]||child;
  var sheetName=$('date').value.replace(/-/g,'').slice(2)+first;
  sheetName=sheetName.slice(0,31);
  wb.SheetNames=[sheetName];
  wb.Sheets[sheetName]=ws;
  delete wb.Sheets['記録テンプレート'];

  // 対象児：原本の「対象児」欄（A5:G5）へ。
  setCellKeepStyle(ws,'A5',child,true);

  // 訪問日：原本の年/月/日欄へ。
  setCellKeepStyle(ws,'P4',d.reiwa,false);
  setCellKeepStyle(ws,'S4',d.month,false);
  setCellKeepStyle(ws,'V4',d.day,false);
  setCellKeepStyle(ws,'Z4',d.weekday,false);

  // 訪問時間：N5:O5＝開始時、Q5:R5＝開始分、T5:U5＝終了時、W5:X5＝終了分。
  var st=($('startTime')&&$('startTime').value)||'';
  var et=($('endTime')&&$('endTime').value)||'';
  if(st){
    var sp=st.split(':');
    setCellKeepStyle(ws,'N5',sp[0]||'',false);
    setCellKeepStyle(ws,'Q5',sp[1]||'',false);
  }
  if(et){
    var ep=et.split(':');
    setCellKeepStyle(ws,'T5',ep[0]||'',false);
    setCellKeepStyle(ws,'W5',ep[1]||'',false);
  }
  // 「分」の表示を明示的に保持。
  setCellKeepStyle(ws,'AA5','分',false);

  // 記録本文：①②③の入力欄。上寄せ＋折り返しで表示。
  setCellKeepStyle(ws,'C8',$('school').value||'',true,true);
  setCellKeepStyle(ws,'C16',$('direct').value||'',true,true);
  setCellKeepStyle(ws,'D28',$('indirect').value||'',true,true);

  // 予備欄は空にする。
  setCellKeepStyle(ws,'C11','',true);
  setCellKeepStyle(ws,'C21','',true);
  setCellKeepStyle(ws,'D34','',true);

  var out=XLSX.write(wb,{bookType:'xlsx',type:'array',cellStyles:true,compression:true});
  var blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=fileName();document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},2000);
  status('Excelを出力しました。ファイル名：'+fileName());
 }catch(e){
  console.error(e);
  status('Excel出力でエラーが発生しました。テンプレートがGitHubにアップロードされているか確認してください。');
 }
}

$("recordTab").onclick=function(){show("recordPage")};
$("historyTab").onclick=function(){renderHistory();show("historyPage")};
$("settingsTab").onclick=function(){show("settingsPage")};
$("organize").onclick=organize;$("save").onclick=saveRecord;$("new").onclick=newRecord;$("voice").onclick=voice;
$("deleteRecord").onclick=deleteCurrent;$("deleteChild").onclick=deleteChild;$("exportExcel").onclick=exportExcel;
$("addChild").onclick=function(){var n=prompt("児童名を入力してください");if(n&&n.trim()&&children.indexOf(n.trim())<0){children.push(n.trim());persist();renderChildren();$("child").value=n.trim();newRecord()}};
renderChildren();$("date").value=new Date().toISOString().slice(0,10);
</script>
</body></html>
